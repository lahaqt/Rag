services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: authoring
      POSTGRES_USER: ${AUTHORING_POSTGRES_USER:?Set AUTHORING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTHORING_POSTGRES_PASSWORD:?Set AUTHORING_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${AUTHORING_POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d authoring"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${AUTHORING_REDIS_PASSWORD:?Set AUTHORING_REDIS_PASSWORD}"]
    ports: ["127.0.0.1:26380:6379"]
    volumes: ["redis-data:/data"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${AUTHORING_ELASTIC_PASSWORD:?Set AUTHORING_ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:29200:9200"]
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]

  rustfs:
    image: rustfs/rustfs:latest
    command: ["--address", ":9000", "--console-enable", "--access-key", "${AUTHORING_RUSTFS_ACCESS_KEY:?Set AUTHORING_RUSTFS_ACCESS_KEY}", "--secret-key", "${AUTHORING_RUSTFS_SECRET_KEY:?Set AUTHORING_RUSTFS_SECRET_KEY}", "/data"]
    ports:
      - "127.0.0.1:29100:9000"
      - "127.0.0.1:29101:9001"
    volumes: ["rustfs-data:/data"]

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
  rustfs-data:
